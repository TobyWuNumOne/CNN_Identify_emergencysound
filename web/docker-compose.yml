version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: emergency-sound-backend
    ports:
      - "8000:8000"
    volumes:
      - ../shared/models:/app/shared/models:ro
      - ./backend:/app
    environment:
      - PYTHONPATH=/app
      - MODEL_PATH=/app/shared/models/simple-train-nb30&25
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emergency-sound-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 可選: Redis 用於會話管理和緩存
  redis:
    image: redis:7-alpine
    container_name: emergency-sound-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data:

networks:
  default:
    name: emergency-sound-network